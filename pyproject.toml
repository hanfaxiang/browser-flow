[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browserflow"]

[project]
name = "browser-flow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.13.10",
    "langchain>=1.4.3",
    "langchain-openai>=1.3.4",
    "langgraph>=1.2.12",
    "loguru>=0.7.3",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.2",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
